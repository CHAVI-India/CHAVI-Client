# Sets the max number of simultaneous connections that can be opened by a worker process
events {
   worker_connections 1024;
}

http {
   server {
       include mime.types;
       default_type application/octet-stream;
       sendfile on;
       keepalive_timeout 7200;  # Keep connections alive for 2 hours
       client_body_timeout 300s;  # Timeout for reading client request body
       client_header_timeout 60s;  # Timeout for reading client request header
       send_timeout 7200s;  # Timeout for sending response to client
       listen 80;
       client_max_body_size 10G; # Add this line to increase the maximum upload size to 1024MB

       # Requests to /static/ are served directly from the /static/ directory
       location /static/ {
           alias /static/;
           expires 7d;
       }

       # Configuration for serving media files
       # location /media/ {
       #     alias /home/app/web/mediafiles/;
       # }

       # Handles all other requests
       location / {
           # Forward requests to Django application
           proxy_pass http://chaviclient-django:8000;

           # Pass important headers to Django for proper request handling
           proxy_set_header Host $host;                          # Original host header
           proxy_set_header X-Real-IP $remote_addr;             # Client's real IP
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Chain of IP addresses
           proxy_set_header X-Forwarded-Proto $scheme;          # Original protocol (http/https)

           # Optimized timeout settings for long-running requests
           proxy_read_timeout 7200s;        # 2 hours - time to read response from upstream
           proxy_connect_timeout 60s;       # Connection timeout to upstream
           proxy_send_timeout 7200s;        # Time to send request to upstream
           
           # Buffer settings for large responses
           proxy_buffering on;
           proxy_buffer_size 128k;
           proxy_buffers 4 256k;
           proxy_busy_buffers_size 256k;
           
           # Prevent timeouts during slow client connections
           proxy_temp_file_write_size 256k;
           proxy_max_temp_file_size 1024m;
       }
   }
}