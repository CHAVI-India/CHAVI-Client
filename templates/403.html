<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden | CHAVI Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2a9d8f 0%, #264653 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #264653;
        }

        .error-container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            margin: 2rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #e76f51;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .error-title {
            font-size: 2rem;
            font-weight: 600;
            color: #264653;
            margin-bottom: 1.5rem;
        }

        .error-message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4d7a8a;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .action-btn {
            display: inline-block;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #2a9d8f 0%, #264653 100%);
            color: white;
        }

        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 157, 143, 0.35);
        }

        .action-btn-secondary {
            background: #eef4f5;
            color: #264653;
            border: 2px solid #b3cbd1;
        }

        .action-btn-secondary:hover {
            background: #d9e5e8;
            border-color: #4d7a8a;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 2rem;
                margin: 1rem;
            }

            .error-code {
                font-size: 4rem;
            }

            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon">🚫</div>
        <div class="error-code">403</div>
        <!-- ui-lint:ok standalone error page -->
    <!-- ui-lint:ok standalone error page --><h1 class="error-title">Access Forbidden</h1>
        <div class="error-message">
            <p><strong>You are not allowed to view this page.</strong></p>
            <p>You don't have the necessary permissions to access this resource. Please go back to the home page.</p>
            <p>If you think you should be getting access to this page, please ask the account administrator for access.</p>
        </div>
        <div class="error-actions">
            <a href="/" class="action-btn action-btn-primary">Go to Home Page</a>
            <button onclick="history.back()" class="action-btn action-btn-secondary">Go Back</button>
        </div>
    </div>
</body>
</html>
