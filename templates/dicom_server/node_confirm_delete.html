{% extends "base.html" %}
{% block title %}Delete Remote Node - CHAVI Client{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
    {% include "dicom_server/_messages.html" %}
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Delete Remote Node</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <p class="text-sm text-gray-700 mb-4">Delete remote node <strong>{{ object }}</strong>? This cannot be undone.</p>
        <form method="post" class="flex space-x-3">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Delete</button>
            <a href="{% url 'dicom_server:node_list' %}" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
