{% extends "admin/change_list.html" %}
{% load i18n %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    display: none;
  }
  .spinner {
    border: 5px solid #d9e5e8;
    border-top: 5px solid #2a9d8f;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 2s linear infinite;
  }
  .spinner-text {
    color: white;
    margin-left: 15px;
    font-size: 18px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
{% endblock %}

{% block footer %}
{{ block.super }}
<div class="loading-overlay" id="processingOverlay">
  <div style="display: flex; align-items: center;">
    <div class="spinner"></div>
    <div class="spinner-text">Processing DICOM files...</div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const actionSelect = document.querySelector('select[name="action"]');
    const goButton = document.querySelector('button[name="index"]');
    
    if (actionSelect && goButton) {
      goButton.addEventListener('click', function(e) {
        if (actionSelect.value === 'process_dicom'|| actionSelect.value === 'process_bulk_dicom') {
          document.getElementById('processingOverlay').style.display = 'flex';
        }
      });
    }
  });
</script>
{% endblock %}
