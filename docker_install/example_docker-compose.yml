services:
  chaviclient-database:
    image: postgres:17
    restart: always
    container_name: chaviclient-database
    ports:
      - "5433:5432"
    volumes:
      - chaviclient_postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  chaviclient-django:
    image: chaviapp/chaviclient:main
    container_name: chaviclient-django
    restart: always
    depends_on:
      chaviclient-database:
        condition: service_healthy
    env_file:
      - .env      
    volumes:
      - chaviclient_app_data:/app
      - ./media:/app/media
      - ./static:/app/static
    command: ["./entrypoint.docker.sh"]

  chaviclient-proxy:
    image: nginx:latest
    container_name: chaviclient-proxy
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
    depends_on:
      - chaviclient-django
volumes:
  chaviclient_postgres_data:
  chaviclient_app_data:

