{# NavLink — top-level navbar link with tight sun underline when active #}
{# kwargs: href, icon, label (or default slot), active (bool), target #}
<a href="{{ href }}"{% if target %} target="{{ target }}"{% endif %}
   class="text-white hover:bg-white hover:bg-opacity-20 px-3 py-2 rounded-md text-sm font-medium transition-all {{ extra_class }}">
    <i class="fas {{ icon }} mr-1 text-chavi-primary-300"></i><span class="pb-0.5 {% if active %}border-b-2 border-chavi-sun-400{% endif %}">{{ label }}{% slot "default" %}{% endslot %}</span>
</a>
