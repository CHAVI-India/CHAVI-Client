{# DataList — key-value grid; items: [{label, value}] #}
<div class="grid {% if columns == '1' %}grid-cols-1{% elif columns == '2' %}grid-cols-1 md:grid-cols-2{% elif columns == '3' %}grid-cols-1 md:grid-cols-2 lg:grid-cols-3{% else %}grid-cols-1 md:grid-cols-2 lg:grid-cols-4{% endif %} gap-6 {{ extra_class }}">
    {% for item in items %}
    <div class="bg-gray-50 rounded-lg p-4">
        <p class="text-xs font-semibold text-gray-500 uppercase mb-1">{{ item.label }}</p>
        <p class="text-sm font-semibold text-gray-900">{{ item.value }}</p>
    </div>
    {% endfor %}
</div>
