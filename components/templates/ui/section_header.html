{# SectionHeader — section title + optional actions #}
<div class="flex items-center justify-between mb-4 {{ extra_class }}">
    <h2 class="text-2xl font-bold text-gray-900 flex items-center">
        {% if icon %}<i class="{{ icon }} {{ icon_class|default:'text-chavi-primary' }} mr-3"></i>{% endif %}
        {% if component_vars.is_filled.default %}{% slot "default" %}{% endslot %}{% else %}{{ title }}{% endif %}
    </h2>
    {% if component_vars.is_filled.actions %}
    <div class="flex items-center gap-3">
        {% slot "actions" %}{% endslot %}
    </div>
    {% endif %}
</div>
