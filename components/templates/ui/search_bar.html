{# SearchBar — canonical GET search form #}
<div class="bg-white rounded-lg shadow-md p-4 mb-6 {{ extra_class }}">
    <form method="{{ method|default:'get' }}" action="{{ action|default:'' }}" class="flex items-center gap-3">
        <div class="flex-1">
            <label for="search-{{ name|default:'q' }}" class="sr-only">{{ placeholder|default:'Search' }}</label>
            <input type="search" id="search-{{ name|default:'q' }}" name="{{ name|default:'q' }}" value="{{ value|default:'' }}"
                   placeholder="{{ placeholder|default:'Search…' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-chavi-primary focus:border-chavi-primary transition-colors">
        </div>
        {% slot "extra_fields" %}{% endslot %}
        <button type="submit" class="inline-flex items-center justify-center font-semibold rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-chavi-primary px-4 py-2 text-sm bg-chavi-gradient text-white hover:shadow-lg hover:-translate-y-0.5">
            <i class="fas fa-search mr-2"></i>{{ button_text|default:'Search' }}
        </button>
    </form>
</div>
