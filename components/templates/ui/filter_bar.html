{# FilterBar — filter form wrapper; slots: fields, actions #}
<div class="bg-white border border-chavi-sand-200 rounded-lg shadow p-4 mb-6 {{ extra_class }}">
    <form method="{{ method|default:'get' }}" action="{{ action|default:'' }}">
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-3">
            {% slot "fields" %}{% endslot %}
        </div>
        {% if component_vars.is_filled.actions %}
            {% slot "actions" %}{% endslot %}
        {% else %}
        <div class="mt-3 flex items-center space-x-3">
            <button type="submit" class="inline-flex items-center justify-center font-semibold rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-chavi-primary px-4 py-2 text-sm bg-chavi-charcoal-600 text-white hover:bg-chavi-charcoal-700">
                <i class="fas fa-filter mr-2"></i>Apply
            </button>
            {% if clear_url %}
            <a href="{{ clear_url }}" class="inline-flex items-center justify-center font-semibold rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-chavi-primary px-4 py-2 text-sm bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">
                <i class="fas fa-times mr-2"></i>Clear
            </a>
            {% endif %}
        </div>
        {% endif %}
    </form>
</div>
